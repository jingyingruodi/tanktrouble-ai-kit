<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>TankTrouble AI 监控室</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#c9d1d9; --dim:#8b949e; --accent:#58a6ff; --good:#3fb950; --bad:#f85149; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:"Segoe UI",system-ui,sans-serif; }
  header { padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .c { color:var(--dim); font-size:12px; }
  button { background:#21262d; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; font-size:12px; }
  button:hover { border-color:var(--accent); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(430px,1fr)); gap:12px; padding:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; }
  .card h2 { font-size:13px; margin:0 0 6px; color:var(--dim); font-weight:500; }
  .card .hdr { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .status { font-size:11px; padding:2px 8px; border-radius:10px; }
  .status.on { background:#21262d; color:var(--good); }
  .status.off { background:#21262d; color:var(--bad); }
  canvas { width:100%; background:#0a0c10; border:1px solid var(--line); border-radius:6px; }
  .meta { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; margin-top:6px; color:var(--dim); }
  .meta b { color:var(--fg); }
  .roles span { margin-right:10px; font-size:12px; }
  .tank { display:inline-flex; align-items:center; gap:6px; margin:4px 10px 0 0; font-size:12px; padding:2px 8px; border-radius:6px; background:#21262d; }
  .tank .dot { width:9px; height:9px; border-radius:2px; display:inline-block; }
  .kill-succ { color:var(--good); }
</style>
</head>
<body>
<header>
  <h1>🎮 TankTrouble AI 监控室</h1>
  <span class="c">端口基准 <b id="baseport">9310</b></span>
  <button onclick="autoDiscover()">🔍 自动发现</button>
  <span class="c" id="discoverInfo"></span>
</header>
<div id="grid" class="grid"></div>

<script>
const BASE = 9310;      // 与 monitor_server.STATE_BASE_PORT 一致
const MAX_TRY = 8;      // 探测 9310..9317
let livePorts = [];     // 确认有状态的端口列表
let wsList = [];

function statusHtml(state){
  // no gc = 游戏尚未进入对局（还停在大厅），非故障
  if (state && state.err === 'no gc') return `<span class="status off">⏳ 未进入对局（大厅）</span>`;
  if (state && state.err === 'no GameManager') return `<span class="status off">⏳ 页面加载中…</span>`;
  if (state && state.err) return `<span class="status off">离线 · ${state.err}</span>`;
  if (state && state.roundActive) return `<span class="status on">对局中</span>`;
  if (state && state.countingDown) return `<span class="status on">倒计时</span>`;
  return `<span class="status off">回合间</span>`;
}

function renderCard(port, state){
  // state: {type:'state', data:{...}} 或带 err
  const data = state && state.data ? state.data : state;
  const src = data && data._source || '';
  const txt = port + (src==='tm' ? ' (TM)' : data && data._cdpPort ? ` (CDP ${data._cdpPort})` : '');
  const roles = (data && data.roles) || {};
  const scoresK = (data && data.scoresKill) || {};
  const scoresV = (data && data.scoresVict) || {};
  const tanks = (data && data.tanks) || {};
  let tanksHtml = '';
  for (const id in tanks){
    const t = tanks[id];
    const role = roles[id] || '?';
    const color = role==='arrows' ? '#f85149' : role==='keyboard' ? '#58a6ff' : '#3fb950';
    const rect = `/2×4m`;
    tanksHtml += `<span class="tank"><span class="dot" style="background:${color}"></span> ${role} · ${id.slice(-5)} · ${t.x.toFixed(0)},${t.y.toFixed(0)} · 武${t.weapon}</span>`;
  }
  const maze = data && data.maze ? `${data.maze.w}×${data.maze.h}格` : '';
  const proj = (data && data.projectiles && data.projectiles.length) || 0;
  return `
    <div class="card">
      <div class="hdr"><h2>实例 ${txt}</h2>${statusHtml(data)}</div>
      <canvas id="cv-${port}" width="430" height="300"></canvas>
      <div class="meta">
        <span>角色: <b>${Object.keys(roles).length}</b></span>
        <span>迷宫: <b>${maze||'—'}</b></span>
        <span>弹丸: <b>${proj}</b></span>
      </div>
      <div class="roles">${tanksHtml||'<span style="color:var(--dim)">无坦克</span>'}</div>
      <div class="meta">
        <span>击杀: ${Object.keys(scoresK).map(k=>`${k.slice(-4)}:${scoresK[k]}`).join(' ')}</span>
        <span>胜利: ${Object.keys(scoresV).map(k=>`${k.slice(-4)}:${scoresV[k]}`).join(' ')}</span>
      </div>
    </div>`;
}

function draw(state, port){
  const data = state && state.data ? state.data : state;
  if (!data || data.err){ return; }
  const cv = document.getElementById('cv-'+port);
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  ctx.clearRect(0,0,W,H);
  const tiles = (data.maze && data.maze.w) ? data.maze.w : 6;
  const worldH = (data.maze && data.maze.h) ? data.maze.h * 10 : 40; // 格数*10m
  const worldW = data.maze ? data.maze.w * 10 : 60;
  // scale: fit canvas
  const s = Math.min(W/worldW, H/worldH) * 0.92;
  const ox = (W - worldW*s)/2, oy = (H - worldH*s)/2;
  // walls
  ctx.strokeStyle = '#484f58';
  ctx.lineWidth = 2;
  (data.walls||[]).forEach(w=>{
    ctx.beginPath();
    ctx.moveTo(ox+w.x1*s, oy+w.y1*s);
    ctx.lineTo(ox+w.x2*s, oy+w.y2*s);
    ctx.stroke();
  });
  // tanks
  for (const id in (data.tanks||{})){
    const t = data.tanks[id];
    const role = (data.roles||{})[id] || '?';
    const color = role==='arrows' ? '#f85149' : role==='keyboard' ? '#58a6ff' : '#3fb950';
    const x = ox + t.x*s, y = oy + t.y*s;
    ctx.fillStyle = color;
    ctx.fillRect(x-4, y-4, 8, 8);
    // barrel
    ctx.strokeStyle = color; ctx.lineWidth = 2;
    ctx.beginPath();
    const a = t.rot || 0; // rot 弧度
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(a- Math.PI/2)*9, y + Math.sin(a- Math.PI/2)*9);
    ctx.stroke();
    ctx.fillStyle = '#0d1117';
    ctx.fillText(id.slice(-4), x-8, y-8);
  }
  // projectiles
  ctx.fillStyle = '#e3b341';
  (data.projectiles||[]).forEach(p=>{
    ctx.beginPath();
    ctx.arc(ox+p.x*s, oy+p.y*s, 2.5, 0, Math.PI*2);
    ctx.fill();
  });
}

function connect(port){
  const ws = new WebSocket(`ws://localhost:${port}`);
  ws.onopen = ()=>{ wsList.push({port, ws}); };
  ws.onmessage = (ev)=>{
    const state = JSON.parse(ev.data);
    let host = livePorts.indexOf(port);
    if (host < 0){ livePorts.push(port); renderBase(port, state); }
    else renderBase(port, state);
    // 只在有数据时绘制（若 err 则不重绘 canvas）
    if (!(state.data && state.data.err)) draw(state, port);
  };
  ws.onclose = ()=>{ /* 保留卡片标记离线 */ };
  ws.onerror = ()=>{};
}

function renderBase(port, state){
  const grid = document.getElementById('grid');
  let card = document.getElementById('card-'+port);
  if (!card){
    card = document.createElement('div');
    card.id = 'card-' + port;
    card.style.display = 'contents';
    grid.appendChild(card);
  }
  card.innerHTML = renderCard(port, state);
}

async function probePort(port){
  try{
    // 先做一次 WS 握手探测
    return await new Promise((resolve)=>{
      const ws = new WebSocket(`ws://localhost:${port}`);
      const to = setTimeout(()=>{ try{ws.close();}catch(e){} resolve(false); }, 900);
      ws.onopen = ()=>{ clearTimeout(to); resolve(true); try{ws.close();}catch(e){} };
      ws.onerror = ()=>{ clearTimeout(to); resolve(false); };
    });
  }catch(e){ return false; }
}

async function autoDiscover(){
  const info = document.getElementById('discoverInfo');
  info.textContent = '探测中...';
  const found = [];
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  // 先清旧连接
  wsList.forEach(x=>{ try{x.ws.close();}catch(e){} });
  wsList = [];
  livePorts = [];
  for (let p = BASE; p < BASE + MAX_TRY; p++){
    const ok = await probePort(p);
    if (ok){ found.push(p); connect(p); }
  }
  info.textContent = `发现 ${found.length} 个实例: ${found.join(', ')||'无'}`;
}

// 首次自动发现
autoDiscover();
</script>
</body>
</html>
